
{% extends "pages/base.html" %}

{% block content %}
<h1>Mi panel</h1>

<p>¡Bienvenido, {{ user.username }}!</p>

<p>Has visitado este panel {{ visits }} veces durante tu sesión.</p>

<form method="post" action="{% url 'pages:logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesión</button>
</form>
{% endblock %}
